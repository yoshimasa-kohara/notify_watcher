# 通知監視の設定ファイル
#
# 保存すると、次の通知から反映されます(プログラムの再起動はいりません)。
# 日本語の項目名は "" で囲んでください。
# 書き間違いで読めないときは、ログに警告を出して、前の設定で鳴らします。

# 通知音の音量(0〜100)。Windows の音量を上限とした大きさです
"音量" = 100

# 音ごとの音量(0〜100)。mp3 のファイル名(拡張子なし)ごとに書きます
# 書いていない音は、上の「音量」で鳴ります
# 使うときは、行の先頭の # を消してください
["音ごとの音量"]
"確認" = 100
"完了" = 100
"通知" = 100
